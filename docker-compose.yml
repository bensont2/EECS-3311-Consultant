
services:
  # ── Database Container (PostgreSQL) ──
  db:
    image: postgres:15         
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eecs3311 -d booking_platform"]    
      timeout: 5s
      retries: 5

  # ── Backend Container (Flask + Gunicorn) ──
  backend:
    image: kingben88/backend:latest
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      TEMPLATE_DIR: /frontend/templates
      AI_key: ${AI_key}
    volumes:
      - ./Frontend/templates:/frontend/templates:ro
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ── Frontend Container (Nginx Reverse Proxy) ──
  frontend:
    image: kingben88/frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge