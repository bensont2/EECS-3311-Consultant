{% extends 'base.html' %}
{% block content %}
<h2>Consultant Dashboard</h2>
<p class="page-subtitle">Here's an overview of your schedule and requests.</p>

<div class="dashboard-grid">
    <a href="/consultant/availability" class="dash-card">
        <span class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#10B981" stroke-width="1.5"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg></span>
        <div class="card-title">Availability</div>
        <div class="card-value">{{ slot_count }}</div>
        <div class="card-desc">Open time slots</div>
        <div class="card-action">Manage availability &rarr;</div>
    </a>
    <a href="/consultant/requests" class="dash-card">
        <span class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#10B981" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22 6 12 13 2 6" /></svg></span>
        <div class="card-title">Pending Requests</div>
        <div class="card-value">{{ requests|length }}</div>
        <div class="card-desc">Awaiting your response</div>
        <div class="card-action">View requests &rarr;</div>
    </a>
</div>
{% endblock %}
