{% extends 'base.html' %}
{% block content %}
<h2>Process Payment</h2>
<p class="page-subtitle">Complete your booking payment securely.</p>

<div class="payment-container">
    <div class="payment-summary">
        <h3>Booking Summary</h3>
        <div class="summary-row">
            <span>Service:</span>
            <span>{{ booking.service.name }}</span>
        </div>
        <div class="summary-row total">
            <span>Amount Due:</span>
            <span class="amount">${{ booking.service.base_price }}</span>
        </div>
    </div>

    <form method="POST" class="payment-form">
        <div class="form-group">
            <label for="payment_method">Payment Method</label>
            <select name="payment_method" id="payment_method" onchange="showFields(this.value)" required>
                <option value="">-- Select a method --</option>
                <option value="credit_card">Credit Card</option>
                <option value="debit_card">Debit Card</option>
                <option value="paypal">PayPal</option>
                <option value="bank_transfer">Bank Transfer</option>
            </select>
        </div>

        <!-- Credit Card Fields -->
        <div id="fields_credit_card" class="payment-fields" style="display:none;">
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" name="card_number" placeholder="1234 5678 9012 3456" maxlength="16">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" name="expiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" name="cvv" placeholder="123" maxlength="4">
                </div>
            </div>
        </div>

        <!-- Debit Card Fields (fixed: uses same field names as credit card) -->
        <div id="fields_debit_card" class="payment-fields" style="display:none;">
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" name="card_number" placeholder="1234 5678 9012 3456" maxlength="16">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" name="expiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" name="cvv" placeholder="123" maxlength="4">
                </div>
            </div>
        </div>

        <!-- PayPal Fields -->
        <div id="fields_paypal" class="payment-fields" style="display:none;">
            <div class="form-group">
                <label>PayPal Email</label>
                <input type="email" name="email" placeholder="your@email.com">
            </div>
        </div>

        <!-- Bank Transfer Fields -->
        <div id="fields_bank_transfer" class="payment-fields" style="display:none;">
            <div class="form-group">
                <label>Account Number</label>
                <input type="text" name="account_number" placeholder="Account Number">
            </div>
            <div class="form-group">
                <label>Routing Number</label>
                <input type="text" name="routing_number" placeholder="Routing Number">
            </div>
        </div>

        <button type="submit" class="btn-pay">Submit Payment</button>
    </form>
</div>

<style>
.payment-container {
    max-width: 500px;
}

.payment-summary {
    background: #0a0a0a;
    border: 1px solid #1f1f1f;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
}

.payment-summary h3 {
    color: #10B981;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    color: #9CA3AF;
    font-size: 0.95rem;
}

.summary-row.total {
    border-top: 1px solid #1f1f1f;
    margin-top: 8px;
    padding-top: 16px;
    color: #FFFFFF;
    font-weight: 600;
}

.summary-row .amount {
    color: #10B981;
    font-size: 1.25rem;
}

.payment-form {
    background: #0d0d0d;
    border: 1px solid #1f1f1f;
    border-radius: 12px;
    padding: 24px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    color: #9CA3AF;
    font-size: 0.85rem;
    margin-bottom: 8px;
}

.form-group input,
.form-group select {
    width: 100%;
    max-width: 100%;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.payment-fields {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #1f1f1f;
}

.btn-pay {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-size: 1rem;
    background: linear-gradient(135deg, #10B981, #059669);
}

.btn-pay:hover {
    background: linear-gradient(135deg, #059669, #047857);
}
</style>

<script>
    function showFields(method) {
        document.querySelectorAll('.payment-fields').forEach(el => {
            el.style.display = 'none';
            el.querySelectorAll('input').forEach(input => input.removeAttribute('required'));
        });

        if (method) {
            const active = document.getElementById('fields_' + method);
            if (active) {
                active.style.display = 'block';
                active.querySelectorAll('input').forEach(input => input.setAttribute('required', true));
            }
        }
    }
</script>
{% endblock %}
