{% extends 'base.html' %}

{% block content %}
<h2>AI Assistant</h2>
<p>The AI Assistant is now available as a chat widget in the bottom-right corner of every page. Click the green button to start chatting!</p>

<script>
    // Auto-open the chat widget when visiting this page
    document.addEventListener('DOMContentLoaded', function() {
        const win = document.getElementById('ai-chat-window');
        if (win && !win.classList.contains('open')) {
            toggleChat();
        }
    });
</script>
{% endblock %}
